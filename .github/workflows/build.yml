name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Check switching logic
        run: dotnet run --project tests/LogicTests.csproj -c Release
      - name: Publish single-file app
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: HisenseDisplaySwitcher-win-x64
          path: artifacts/win-x64/HisenseDisplaySwitcher.exe
